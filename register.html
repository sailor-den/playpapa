<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация - PlayPapa</title>
    <link rel="icon" type="image/svg+xml" href="./assets/blogger-playpapa-logo.svg" />
    <link rel="stylesheet" href="./frame.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./auth-local.css" />
  </head>
  <body class="auth-page-shell">
    <main class="auth-page-card">
      <a class="auth-page-logo" href="./index.html">
        <img src="./assets/logo.svg" alt="PlayPapa" />
      </a>

              <h1>Регистрация</h1>
        <form class="auth-form auth-page-form" data-auth-form="register">
          <label class="auth-field">
            <img src="./assets/auth-user.svg" alt="" />
            <input type="text" name="register-login" placeholder="Логин" autocomplete="username" />
          </label>
          <label class="auth-field">
            <img src="./assets/auth-mail.svg" alt="" />
            <input type="email" name="register-email" placeholder="E-mail" autocomplete="email" />
          </label>
          <label class="auth-field">
            <img src="./assets/auth-lock.svg" alt="" />
            <input type="password" name="register-password" placeholder="Пароль" autocomplete="new-password" />
          </label>
          <label class="auth-field">
            <img src="./assets/auth-lock.svg" alt="" />
            <input type="password" name="register-password-repeat" placeholder="Повторите пароль" autocomplete="new-password" />
          </label>
          <button class="auth-primary" type="submit">Создать аккаунт</button>
        </form>
        <a class="auth-secondary auth-page-link" href="./login.html">Уже есть аккаунт</a>
          </main>
    <script src="./assets/playpapa-auth.js"></script>
  </body>
</html>
